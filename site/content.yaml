  reviews_button: Google で口コミを見る

first:
  heading: はじめての方へ
  steps:
    - title: LINEで予約
      body: 犬種・年齢・ご希望をお知らせください。初回はシルクパックをサービスします。
    - title: ご来店・カウンセリング
      body: 体調や苦手なこと、仕上がりのイメージを伺います。写真を見せていただくのもおすすめです。
    - title: マンツーワンでトリミング
      body: その子のペースに合わせて進めます。待ち時間もケージフリーです。
    - title: お迎え
      body: 当日の様子と、おうちでのお手入れのコツをお伝えします。
  notices_heading: ご予約の前にご確認ください
  notices:
    - 1年以内の混合ワクチン・狂犬病予防接種、ノミ・ダニ対策をお願いします。
    - 持病や噛み癖のある子は、ご予約時にお知らせください。
    - 変更・キャンセルは前日までにお願いします。当日キャンセルは ¥5,000 をいただきます。

staff:
  heading: トリマー兼オーナー
  name: 岡田 有紀
  bio: 兵庫県生まれ、東京育ち、片瀬在住。会社員・主婦を経てトリマーに。愛犬プーの超こわがりが、トリマーになったきっかけです。自宅ではオーストラリアン・ラブラドゥードルのプーとラッテ、猫のチャイと暮らしています。
  note: 看板犬のプーとラッテは、現在は出勤していません。
  photos:
    - src: img/testimonials/yuki.jpg
      name: 岡田 有紀
      alt: トリマー兼オーナーの岡田有紀
    - src: img/site/staff-pooh.jpg
      name: 看板犬 プー
      alt: 看板犬のプー
    - src: img/site/staff-latte.jpg
      name: 看板犬 ラッテ
      alt: 看板犬のラッテ

