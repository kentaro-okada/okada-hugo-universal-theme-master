site:
  title: BLUE PAWS（ブルーパウズ）｜藤沢・片瀬のトリミングサロン
  description: 江ノ島駅・湘南江の島駅から徒歩5分のプライベートトリミングサロン。マンツーワンで、待ち時間もケージフリー。ほかのワンちゃんが苦手な子も安心です。
  keywords: 藤沢,片瀬,江ノ島,トリミングサロン,ドッグサロン,ペットサロン
  url: https://bluepaws.jp/
  og_image: img/site/hero-toypoodle.jpg
  logo: img/bp-logo2024-08-13.jpeg
  line_url: https://line.me/R/ti/p/%40zwb3497w
  instagram_url: https://www.instagram.com/trimmingsalon._.bluepaws/
  reviews_url: https://www.google.com/maps/search/?api=1&query=BLUE+PAWS+%E3%83%96%E3%83%AB%E3%83%BC%E3%83%91%E3%82%A6%E3%82%BA&query_place_id=ChIJvZsl6_9OGGARuoy5hkOVUrg
  # 検索エンジン向けの営業時間（Mo=月 Tu=火 We=水 Th=木 Fr=金 Sa=土 Su=日）
  opening_hours: Mo,Tu,We,Fr,Sa 09:00-17:00
  maps_url: https://www.google.com/maps/search/?api=1&query=BLUE+PAWS+%E3%83%96%E3%83%AB%E3%83%BC%E3%83%91%E3%82%A6%E3%82%BA&query_place_id=ChIJvZsl6_9OGGARuoy5hkOVUrg

hero:
  area: 藤沢・片瀬 ／ 江ノ島駅 徒歩5分
  headline: |
    One dog.
    One groomer.
  catch: |
    イヌのキモチを大切に、
    マンツーワンでていねいに。
  lead: プライベートサロンだから、待ち時間もケージフリーでのんびり。ほかのワンちゃんが苦手な子も安心して過ごせます。
  photos:
    - src: img/site/hero-schnauzer.jpg
      name: ミニチュア・シュナウザー
    - src: img/site/hero-maltipoo-1.jpg
      name: マルプー
    - src: img/site/hero-maltipoo-2.jpg
