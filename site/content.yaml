concept:
  heading: |
    どんなワンちゃんにも、
    やさしい時間を。
  points:
    - title: マンツーワン
      body: 受付からお渡しまで、トリマー兼オーナーがひとりで担当。ワンちゃんの性格にあわせて進めます。
    - title: ケージフリー
      body: 待ち時間もケージに入れず、のんびり過ごせます。同じ時間帯にほかのワンちゃんはいません。
    - title: お手入れしやすいカット
      body: かわいさはそのままに、おうちでのお手入れが楽になるスタイルをご提案します。

